services:
  - type: web
    name: campusbites-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusbites-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Or set a specific secret in the Render dashboard

databases:
  - name: campusbites-db
    databaseName: campusbites
    user: campusbites_user
